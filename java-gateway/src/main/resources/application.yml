server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/lab_person?serverTimezone=UTC&characterEncoding=utf8
    username: lab
    password: labpass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

services:
  material:
    base-url: http://localhost:8082
  borrow:
    base-url: http://localhost:8081
